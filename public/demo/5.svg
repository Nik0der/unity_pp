<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'>
  <defs>
    <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#0d0f14'/>
      <stop offset='100%' stop-color='#161a1f'/>
    </linearGradient>
    <filter id='grain'>
      <feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/>
      <feColorMatrix type='saturate' values='0'/>
      <feBlend mode='multiply'/>
    </filter>
  </defs>
  <rect width='100%' height='100%' fill='url(#g)'/>
  <g opacity='0.6'>
    <circle cx='150' cy='120' r='90' fill='#a78bfa'/>
    <circle cx='620' cy='420' r='140' fill='#a78bfa' opacity='0.6'/>
    <circle cx='420' cy='220' r='70' fill='#a78bfa' opacity='0.8'/>
  </g>
  <rect width='100%' height='100%' opacity='0.12' filter='url(#grain)'/>
</svg>